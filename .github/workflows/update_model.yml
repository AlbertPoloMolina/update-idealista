name: Scheduled model training (every 3 days)

on:
  schedule:
    # Runs at 00:00 UTC every 3 days of the month (cron uses day-of-month stepping: */3).
    - cron: "0 0 */3 * *"
  workflow_dispatch: {}

jobs:
  run-model:
    name: Run modelado.py and upload resulting model(s)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            pip install scikit-learn pandas numpy joblib certifi
          fi

      - name: Run modelado.py
        run: |
          # Ensure the script is executable (if not) and run it
          python modelado.py

      - name: Upload model artifacts
        uses: actions/upload-artifact@v4
        with:
          name: modelos
          path: modelado/*.joblib
