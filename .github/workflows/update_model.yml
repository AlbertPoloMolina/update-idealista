name: Update model (every 3 days)

on:
  schedule:
    - cron: "10 0 */3 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-script:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run script
        env:
          CLIENT_ID: ${{ secrets.CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: python modelado.py

      - name: Commit and push models
        run: |
         git config --global user.name "AlbertPoloMolina"
         git config --global user.email "apolomo@uoc.edu"
         git add modelado/
         git commit -m "Update modelos [skip ci]" || echo "No changes to commit"
         git push
