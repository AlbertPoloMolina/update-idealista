name: Test Scraper Idealista

on:
  workflow_dispatch:
    inputs:
      location:
        description: "Ubicación a scrapear ('vall', 'cordoba', 'all')"
        required: true
        default: "cordoba"
        type: choice
        options:
          - "cordoba"
          - "vall"
          - "all"
      max_pages:
        description: "Número máximo de páginas por operación"
        required: true
        default: "3"

permissions:
  contents: write

jobs:
  run-scraper:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run Web Scraper
        env:
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          PROXY_URL: ${{ secrets.PROXY_URL }}
        run: python scraper_idealista.py --location ${{ github.event.inputs.location }} --max-pages ${{ github.event.inputs.max_pages }}

      - name: Commit and push CSV
        run: |
          git config --global user.name "AlbertPoloMolina"
          git config --global user.email "apolomo@uoc.edu"
          git add historial_idealista*.csv || true
          git commit -m "Update CSV via Scraper [skip ci]" || echo "No changes to commit"
          git push
